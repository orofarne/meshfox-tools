[project]
name = "meshfox-tools"
version = "0.1.0"
description = "Utilities around meshfox (https://meshfox.orofarne.net/) canvases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maksim Dementev", email = "orofarne@gmail.com" }]
dependencies = []

[project.scripts]
obsidian2meshfox = "meshfox_tools.obsidian2meshfox:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
